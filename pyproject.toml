[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "squant"
version = "0.1.0"
description = "Japanese stock systematic trading system (¥100k, S-shares, semi-auto)"
requires-python = ">=3.11"
dependencies = [
    "yfinance==0.2.54",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "gspread==6.1.2",
    "google-auth==2.29.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "jpholiday==0.1.8",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
    "types-python-dateutil>=2.9.0",
    "freezegun>=1.5.0",
    "hypothesis>=6.0",
    "mutmut>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/squant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "network: tests requiring network access (deselect with -m 'not network')",
    "integration: integration tests requiring external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/squant"]
omit = ["*/tests/*"]

# Mutation testing (V-3 検証強化パッケージ). CI には組み込まない（実行時間が長いため）。
# 実行手順は docs/operational_notes.md 末尾を参照。
[tool.mutmut]
source_paths = ["src/squant"]
only_mutate = [
    "src/squant/domain/circuit_breaker.py",
    "src/squant/domain/position_manager.py",
    "src/squant/domain/quantity_calculator.py",
    "src/squant/domain/signal_engine.py",
    "src/squant/domain/slippage.py",
]
pytest_add_cli_args_test_selection = ["tests/unit/domain"]
