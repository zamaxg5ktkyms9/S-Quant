name: Pending Fill Reminder

on:
  # 15:30 JST = 06:30 UTC（大引け後）。前営業日以前に生成された PENDING が
  # 残っていれば Slack で約定報告を催促する。20:30 JST の daily_run が古い
  # PENDING を自動キャンセルするため、その前の記録チャンスを作る（A-5）。
  schedule:
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Remind operator of unconfirmed pending signals
        run: python scripts/remind_pending.py
