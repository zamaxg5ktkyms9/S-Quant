name: Daily Trading Run

on:
  # 20:15 JST = 11:15 UTC (avoid top-of-hour congestion)
  schedule:
    - cron: "15 11 * * 1-5"
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to Sheets)"
        required: false
        default: "true"
        type: boolean
      bypass_execution_time_guard:
        description: "テスト: 20:00 JST ガード無視（本番 cron では false 固定）"
        required: false
        default: "false"
        type: boolean
      bypass_trading_day_check:
        description: "テスト: TSE 営業日チェック無視（本番 cron では false 固定）"
        required: false
        default: "false"
        type: boolean

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
      BYPASS_EXECUTION_TIME_GUARD: ${{ github.event.inputs.bypass_execution_time_guard || 'false' }}
      BYPASS_TRADING_DAY_CHECK: ${{ github.event.inputs.bypass_trading_day_check || 'false' }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Run daily pipeline
        run: python -m squant.main

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: failure-logs-${{ github.run_id }}
          path: "*.log"
          retention-days: 7
