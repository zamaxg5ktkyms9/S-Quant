name: Weekly Summary

on:
  # 土曜 10:00 JST = 01:00 UTC。金曜の daily_run（22〜24時 JST 完走）を確実に
  # 取り込んだうえで「金曜引け後の週次サマリー」を配信する（A-4）。
  schedule:
    - cron: "0 1 * * 6"
  workflow_dispatch: {}

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Send weekly summary
        run: python scripts/weekly_summary.py
