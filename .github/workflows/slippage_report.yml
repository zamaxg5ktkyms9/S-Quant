name: Slippage Weekly Report

on:
  # 金曜 21:15 JST = 12:15 UTC。daily_run（20:30 JST）の後、slippage_log の
  # 直近1週間分を集計して Slack に配信する（A-3）。記録ゼロの週は送信しない。
  schedule:
    - cron: "15 12 * * 5"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Send weekly slippage summary
        run: python scripts/slippage_report.py
