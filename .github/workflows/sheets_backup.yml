name: Sheets Daily Backup

on:
  # 火〜土 00:30 JST = 月〜金 15:30 UTC。daily_run（22〜24時 JST）と
  # watchdog（23:45 JST）の完了後に、その日の最終状態をスナップショットする（A-6）。
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Export all sheet tabs to CSV
        run: python scripts/backup_sheets.py

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/sheets/
          if git diff --cached --quiet; then
            echo "No changes — skipping commit"
          else
            git commit -m "chore(backup): sheets snapshot $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push origin master
          fi
