name: Daily Run Watchdog

on:
  # 23:45 JST = 14:45 UTC. daily_run (20:30 JST cron) は GHA 遅延でも
  # 22:00〜24:00 JST には完走している実績のため、23:45 に run_log を照合する。
  # 当日行が無い/failed なら Slack アラート + この workflow が赤になる。
  schedule:
    - cron: "45 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GCP_SA_KEY_JSON: ${{ secrets.GCP_SA_KEY_JSON }}
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Check run_log for today's success
        run: python scripts/watchdog.py

      # 会計恒等式チェック（V-2）。初期資本は Settings.budget_jpy の既定値
      # （daily_run 本体と同じ経路）。watchdog が赤でも独立に実行する。
      - name: Verify ledger invariants
        if: always()
        run: python scripts/verify_ledger.py
